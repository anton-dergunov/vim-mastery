<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vim Trainer Game 🦊</title>
<style>
  body {
    background: #1e1e1e;
    color: #d4d4d4;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  #game {
    display: grid;
    grid-template-columns: repeat(20, 1.2em);
    grid-template-rows: repeat(10, 1.2em);
    gap: 0;
    border: 2px solid #555;
    background: #2d2d2d;
    padding: 10px;
    box-shadow: 0 0 20px #000;
  }
  .cell {
    width: 1.2em;
    height: 1.2em;
    text-align: center;
    vertical-align: middle;
  }
  .cursor {
    background: #007acc;
    color: #fff;
  }
  .fox {
    color: #f9d342;
  }
  #hint {
    margin-top: 1em;
    color: #9cdcfe;
    font-size: 1.1em;
  }
</style>
</head>
<body>
  <h1>Vim Trainer Game 🦊</h1>
  <div id="game"></div>
  <div id="hint">Hint: Move to the fox using <b>h j k l</b></div>

  <script>
    const rows = 10, cols = 20;
    const grid = document.getElementById('game');
    const cells = [];
    let cursor = { x: 2, y: 2 };
    let fox = { x: 10, y: 5 };

    // Generate random letters grid
    const alphabet = "abcdefghijklmnopqrstuvwxyz";
    for (let y = 0; y < rows; y++) {
      cells[y] = [];
      for (let x = 0; x < cols; x++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = alphabet[Math.floor(Math.random() * alphabet.length)];
        grid.appendChild(cell);
        cells[y][x] = cell;
      }
    }

    // Place the fox
    cells[fox.y][fox.x].textContent = '🦊';
    cells[fox.y][fox.x].classList.add('fox');

    function updateCursor() {
      document.querySelectorAll('.cursor').forEach(c => c.classList.remove('cursor'));
      cells[cursor.y][cursor.x].classList.add('cursor');
    }

    updateCursor();

    function moveCursor(dx, dy) {
      cursor.x = Math.max(0, Math.min(cols - 1, cursor.x + dx));
      cursor.y = Math.max(0, Math.min(rows - 1, cursor.y + dy));
      updateCursor();
      checkGoal();
    }

    function checkGoal() {
      if (cursor.x === fox.x && cursor.y === fox.y) {
        document.getElementById('hint').innerHTML = "🎉 Great job! You found the fox! Press <b>i</b> to insert!";
      }
    }

    document.addEventListener('keydown', e => {
      switch (e.key) {
        case 'h': moveCursor(-1, 0); break;
        case 'j': moveCursor(0, 1); break;
        case 'k': moveCursor(0, -1); break;
        case 'l': moveCursor(1, 0); break;
        case 'i':
          if (cursor.x === fox.x && cursor.y === fox.y) {
            document.getElementById('hint').innerHTML = "✍️ You entered insert mode! Type some text…";
          }
          break;
      }
    });
  </script>
</body>
</html>
