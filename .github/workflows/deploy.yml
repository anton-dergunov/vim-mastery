name: Deploy Vim Wilds

on:
  push:
    branches: [main]
  workflow_dispatch:

# The site is built to run under any path, so one tested commit goes to two
# hosts. Each is switched by a repository variable, so turning a host off
# needs no change here:
#   DEPLOY_CLOUDFLARE_PAGES=true  https://vim-wilds.pages.dev
#   DEPLOY_GITHUB_PAGES=true      https://<owner>.github.io/<repository>/
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install -r scripts/requirements-test.txt
      # The character script tests encode real animated WebPs with img2webp,
      # whose -exact flag needs libwebp 1.4+; Ubuntu's webp package is older.
      # This is Google's static build of the version used locally.
      - name: Install libwebp 1.6.0 tools
        run: |
          curl -sSfL -o /tmp/libwebp.tar.gz https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0-linux-x86-64.tar.gz
          echo "1c5ffab71efecefa0e3c23516c3a3a1dccb45cc310ae1095c6f14ae268e38067  /tmp/libwebp.tar.gz" | sha256sum --check
          tar -xzf /tmp/libwebp.tar.gz -C /tmp
          echo "/tmp/libwebp-1.6.0-linux-x86-64/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the syntax of every app module
        run: git ls-files 'src/*.js' | xargs -n1 node --check
      - run: npm run test:full
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build the versioned PWA
        env:
          # Unset is a supported configuration: the feedback sheet falls back to
          # saving and copying a report instead of posting one.
          VITE_FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "VITE_APP_VERSION=${VERSION}+${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          npm run build
      - run: git diff --check
      - name: Deploy to Cloudflare Pages
        if: vars.DEPLOY_CLOUDFLARE_PAGES == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vim-wilds --branch=main
      # GitHub Pages serves the site from /<repository>/, so it gets its own
      # build of the same commit.
      - name: Build for GitHub Pages
        if: vars.DEPLOY_GITHUB_PAGES == 'true'
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}
        run: npm run build
      - if: vars.DEPLOY_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  github-pages:
    if: vars.DEPLOY_GITHUB_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
